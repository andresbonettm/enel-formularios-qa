    (function () {
        angular.module('app', [])
            .controller('formController', ['$scope', '$http', function ($scope, $http) {
                $scope.saleforce = [];
                $scope.validate = false;
                $scope.lastValidate = false;
                $scope.valueButton = "Ingresa los campos obligatorios";
                $scope.pattern = /^[0-9]+$/;
                $scope.pattern_words = /^[a-zA-Z_áéíóúñ\s]*$/;
                $scope.pattern_cel = /^((?=(3))[0-9]{10})$/;
                $scope.pattern_email = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
                $scope.submit = function (url) {

                    if ($scope.data_saleforce.$invalid) {
                        alert('Todos los campos con asterisco (*) son obligatorios');
                    } else {
                        var urlData = jQuery('#data_saleforce').serialize();

                          $scope.data_saleforce.$invalid = true;
                          jQuery.post(url, urlData, null, 'jsonp').done(function (data) {
                              document.location.href="https://enelsud.info-enel.com/TyC_Reporte_Anonimo";
                          }).fail(function (data) {
                              document.location.href="https://enelsud.info-enel.com/TyC_Reporte_Anonimo";
                          });
                    }
                };
            }]).directive("limitTo", [function () {
            return {
                restrict: "A",
                link: function (scope, elem, attrs) {
                    var limit = parseInt(attrs.limitTo);
                    angular.element(elem).on("keypress", function (e) {
                        if (this.value.length == limit) e.preventDefault();
                    });
                }
            }
        }]);
    })();

                $(this).find('[placeholder]').each(function() {
                    if ($(this).val() == $(this).attr("placeholder")) {

                    }
                });
            });

    });

        const municipio = document.getElementById("town");
        const localidad = document.getElementsByClassName("localidadClass")[0];
        const localidadInput = document.getElementById("localidad");
        let respuesta;
        const validacionMunicipio = () =>{
          municipio.addEventListener('change', function(){
            if(municipio.value === "bogotadc"){
              localidad.style.display = "block";
              localidadInput.setAttribute("required", "");
              localidadInput.required = true;
              respuesta = true;
            }else if(municipio.value !== "bogotadc"){
              localidad.style.display = "none";
              localidadInput.value = "";
              localidadInput.removeAttribute("required");
              localidad.required = false;
              respuesta = true;
            }else if(localidadInput.value == ""){
              respuesta = false;
            }
          });
          return respuesta;
        }

        validacionMunicipio();
